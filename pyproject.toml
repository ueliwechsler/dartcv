[project]
name = "dartcv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benjamin Estermann", email = "benjamin.estermann@bluewin.ch" },
]
requires-python = ">=3.13"
dependencies = ["matplotlib>=3.11.2", "numpy>=2.5.4", "opencv-python>=5.0.0.93"]

[project.scripts]
dartcv = "dartcv:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
