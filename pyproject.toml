[project]
name = "dartcv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benjamin Estermann", email = "benjamin.estermann@bluewin.ch" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=42.0.0",
    "dvc[gdrive]>=3.67.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyopenssl>=24.0.0",
]

[project.scripts]
dartcv = "dartcv:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
