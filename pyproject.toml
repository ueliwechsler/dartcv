[project]
name = "dartcv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benjamin Estermann", email = "benjamin.estermann@bluewin.ch" },
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=42.0.0",
    "dvc[gdrive]>=3.67.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyopenssl>=24.0.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.16",
]

[project.optional-dependencies]
dart-detection = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "transformers>=4.57,<5",
    "pillow>=11",
]

[project.scripts]
dartcv = "dartcv.cli:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ipykernel>=7.4.0", "pytest>=8"]
